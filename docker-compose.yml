x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/scheduler/Dockerfile
  image: oiat-portal:latest
  working_dir: /app
  env_file:
    - .env
  environment:
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
    STATE_ROOT: /data
  volumes:
    - app-data:/data
  restart: unless-stopped
  init: true

services:
  web:
    <<: *app-common
    container_name: oiat-web
    command:
      - /bin/sh
      - -lc
      - python manage.py migrate --noinput && exec gunicorn oiat_portal.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-2} --timeout ${GUNICORN_TIMEOUT:-180}
    ports:
      - "${OIAT_WEB_PORT:-8000}:8000"

  scheduler:
    <<: *app-common
    container_name: oiat-scheduler
    command: ["python", "manage.py", "run_schedule_worker"]
    depends_on:
      - web
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      STATE_ROOT: /data
      OIAT_SCHEDULER_POLL_SECONDS: ${OIAT_SCHEDULER_POLL_SECONDS:-15}
      OIAT_SCHEDULER_ENABLE_ENV_FALLBACK: ${OIAT_SCHEDULER_ENABLE_ENV_FALLBACK:-1}
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 18 * * *}
      SCHEDULE_TZ: ${SCHEDULE_TZ:-Africa/Lagos}

volumes:
  app-data:
